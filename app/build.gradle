plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.eurobuddha.nftwallet'
    compileSdk 36

    defaultConfig {
        applicationId "com.eurobuddha.nftwallet"
        minSdk 28
        targetSdk 35
        versionCode 22
        versionName "0.0.22"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign release with the debug keystore, matching the minima-core-android node app.
            // IPC is authorized by the MINIMA_ID token, not by signature, so this is sufficient
            // for sideloading. Swap to a dedicated release keystore if uploading to Play.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // Tabbed wallet UI
    implementation 'androidx.viewpager:viewpager:1.0.0'
    // QR code generation for the Receive screen
    implementation 'com.google.zxing:core:3.5.3'

    // SVG token icons (Android's BitmapFactory can't rasterise SVG; many Minima tokens use SVG urls)
    implementation 'com.caverock:androidsvg-aar:1.4'

    // NFT gallery grid
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // QR scan (send-to-address)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    testImplementation 'junit:junit:4.13.2'
    // Real org.json on the JVM so engine/metadata tests run without Robolectric
    testImplementation 'org.json:json:20240303'

    implementation files('libs/minimaapi.aar')
}
